name: Secret Scan

# Inlined from farpointhq/.github/.github/workflows/secret-scan.yml, which a
# public repo cannot call because that repo is private. Keep the two in step.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  check-secret-files:
    name: Block secret files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for secret files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ]; then
            FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$ZERO" ] \
               && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            FILES=$(git diff --name-only "${BEFORE_SHA}..HEAD")
          else
            # Manual/scheduled runs, new branches, force-pushes: check the whole tree.
            FILES=$(git ls-files)
          fi

          BLOCKED_PATTERNS=(
            '\.env$'
            '\.env\.'
            '\.pem$'
            '\.key$'
            'credentials\.json$'
            'service-account.*\.json$'
            'secrets\.ya?ml$'
          )

          FOUND=""
          for pattern in "${BLOCKED_PATTERNS[@]}"; do
            MATCHES=$(echo "$FILES" | grep -E "$pattern" || true)
            if [ -n "$MATCHES" ]; then
              FOUND="$FOUND$MATCHES"$'\n'
            fi
          done

          if [ -n "$FOUND" ]; then
            echo "::error::Secret files detected in this changeset:"
            echo "$FOUND" | while read -r f; do
              [ -n "$f" ] && echo "::error::  - $f"
            done
            echo "These file types are blocked by org security policy."
            echo "Use .env.example (without real values) for templates."
            echo "Store secrets in 1Password or GitHub Secrets."
            exit 1
          fi

          echo "No secret files found ($(echo "$FILES" | grep -c . || true) files checked)"

  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fabric API keys (LiteLLM virtual keys) are "sk-" plus 22 URL-safe
      # base64 characters, from secrets.token_urlsafe(16). TruffleHog has no
      # built-in detector for them, so we add one. It never verifies, so its
      # matches come back unverified, which the scan below fails on. The
      # config is written inside .git because the TruffleHog container mounts
      # the checkout; nothing under .git is scanned as content. Same detector
      # as farpointhq/.github's secret-scan.yml.
      - name: Write Fabric API key detector
        run: |
          cat > .git/fabric-trufflehog.yaml <<'EOF'
          detectors:
            - name: FabricAPIKey
              keywords:
                - sk-
              regex:
                key: '(?:^|[^A-Za-z0-9_-])(sk-[A-Za-z0-9_-]{22})(?:[^A-Za-z0-9_-]|$)'
          EOF

      # Push and pull_request scan only the new commits; manual and weekly
      # runs scan the full history. Every finding fails, including keys that
      # don't verify as live (dead keys, private keys, Fabric API keys).
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@v3.99.2
        with:
          version: 3.99.2
          extra_args: --config=/tmp/.git/fabric-trufflehog.yaml
